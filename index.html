<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nossoflix</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>
    <header class="header">
        <div class="header-content">
            <h1 class="logo" id="site-logo">NOSSOFLIX</h1>
        </div>
    </header>

    <section class="hero" id="hero">
        <div class="hero-content">
            <h2 class="hero-title" id="hero-title">Carregando...</h2>
            <p class="hero-description" id="hero-description">Buscando nossas memórias...</p>
            <button class="hero-button" id="play-hero-btn" style="display: none;">▶ Assistir</button>
        </div>
    </section>

    <main class="main-content">
        <div id="rows-container"></div>
    </main>

    <footer class="footer">
        <p id="footer-text">Feito com ❤️ para nós dois.</p>
        <a href="admin.html" class="adm-link">adm</a>
    </footer>

    <div id="media-modal" class="modal">
        <div class="modal-content">
            <span class="close-button" id="close-modal">&times;</span>
            <div id="modal-body"></div>
            <div class="modal-caption" id="modal-caption"></div>
        </div>
    </div>

    <script type="module" src="script.js"></script>
</body>
</html>
